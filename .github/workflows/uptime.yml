name: uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Verificar endereços
        id: chk
        run: bash scripts/check.sh

      - name: Abrir ou atualizar issue de queda
        if: steps.chk.outputs.fora != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --label queda --state open --json number -q '.[0].number')
          if [ -z "$n" ]; then
            gh label create queda --color B60205 --description "Serviço fora do ar" 2>/dev/null || true
            gh issue create --title "Queda detectada: $(wc -l < down.txt) endereço(s) fora do ar" --label queda --body-file report.md
          else
            gh issue edit "$n" --body-file report.md
          fi

      - name: Fechar issue quando tudo voltar
        if: steps.chk.outputs.fora == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label queda --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Todos os endereços voltaram a responder. $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          done
