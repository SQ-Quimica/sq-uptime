name: keepalive
# Repositório público: o GitHub desativa agendamentos após 60 dias sem atividade.
# Este job registra um heartbeat semanal para manter o monitor ativo.
on:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "chore: heartbeat semanal do monitor" && git push
